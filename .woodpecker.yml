steps:
  build-and-push:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: https://registry.itxworks.eu
      repo: registry.itxworks.eu/mailcow-lldap-sync
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
        - ${CI_COMMIT_TAG}
      platforms: linux/amd64,linux/arm64
      insecure: true
      dockerfile: Dockerfile
    when:
     event: [ push, cron, manual, tag ]

  dockle:
    image: goodwithtech/dockle:latest
    commands:
      - dockle
        --exit-code 1
        --exit-level FATAL
        registry.itxworks.eu/mailcow-lldap-sync:${CI_COMMIT_SHA:0:8}
    when:
      event: [ push, cron, manual, tag ]

  copy-push-dockerhub:
    image: quay.io/skopeo/stable:latest
    environment:
      DOCKER_USERNAME:
        from_secret: DOCKER_USERNAME
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
    commands:
      - skopeo login docker.io
        --username "$DOCKER_USERNAME"
        --password "$DOCKER_PASSWORD"

      - skopeo copy --all
        docker://registry.itxworks.eu/mailcow-lldap-sync:${CI_COMMIT_SHA:0:8}
        docker://docker.io/mp0185/mailcow-lldap-sync:${CI_COMMIT_SHA:0:8}

      - skopeo copy --all
        docker://registry.itxworks.eu/mailcow-lldap-sync:${CI_COMMIT_SHA:0:8}
        docker://docker.io/mp0185/mailcow-lldap-sync:latest

    when:
      event: [ push, cron, manual, tag ]

